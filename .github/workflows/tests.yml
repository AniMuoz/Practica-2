name: Tests

on:
  push:
  pull_request:

jobs:
  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prog2/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prog2/back/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          # Valores de prueba: los tests no se conectan a Supabase.
          SUPABASE_URL: http://127.0.0.1:1
          SUPABASE_SERVICE_ROLE_KEY: clave-de-prueba
          CLAVE_DATOS: clave-datos-de-prueba

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prog2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prog2/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
