<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutoriales</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='logo.ico') }}" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #66a29b;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Grid responsiva para las tarjetas */
        .tarjetas-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) { .tarjetas-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .tarjetas-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .tarjetas-container { grid-template-columns: 1fr; } }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title { margin: 0 0 8px 0; font-size: 1.05rem; color: #333; }
        .card-description { margin: 0; color: #666; font-size: 0.85rem; line-height: 1.3; }

        .btn-volver {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-volver:hover { background-color: #0056b3; }

        /* --- NUEVOS ESTILOS PARA EL ZOOM (LIGHTBOX) --- */

        /* 1. Estilo de la imagen miniatura clickeable */
        .card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            cursor: pointer; /* Cambia el cursor a una mano */
            transition: opacity 0.2s;
        }

        .card-img:hover {
            opacity: 0.8; /* Efecto visual al pasar el mouse */
        }

        /* 2. El contenedor del Zoom (Overlay) */
        .zoom-overlay {
            display: none; /* Oculto por defecto */
            position: fixed; /* Fijo en la pantalla */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* Fondo oscuro semitransparente */
            z-index: 1000; /* Asegura que esté por encima de todo */
            justify-content: center;
            align-items: center;
            cursor: zoom-out; /* Cursor para indicar que se cierra al hacer clic */
        }

        /* 3. La imagen grande dentro del overlay */
        .zoom-overlay img {
            max-width: 90%;
            max-height: 90%;
            border: 4px solid white;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            /* Animación suave de entrada */
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        /* Clase que aplica JavaScript para mostrar el overlay */
        .zoom-overlay.activo {
            display: flex;
        }

        .zoom-overlay.activo img {
            transform: scale(1); /* Escala real al estar activo */
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Paso a paso</h1>
        <a href="{{ url_for('home') }}" class="btn-volver">← Volver</a>
    </div>

    <!-- Contenedor de las tarjetas -->
    <div class="tarjetas-container">
        {% for t in tarjetas %}
        <div class="card">
            <!-- HTML MODIFICADO: Añadida clase 'card-img' y 'onclick' -->
            <img src="{{ t.imagen }}" 
                 alt="{{ t.titulo }}" 
                 class="card-img" 
                 onclick="abrirZoom(this.src)">
                 
            <div class="card-content">
                <h2 class="card-title">{{ t.titulo }}</h2>
                <p class="card-description">{{ t.descripcion }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- NUEVO HTML: Contenedor del Overlay para el Zoom -->
    <div id="zoomOverlay" class="zoom-overlay" onclick="cerrarZoom()">
        <img id="zoomImagen" src="" alt="Imagen agrandada">
    </div>

    <!-- NUEVO SCRIPT: Lógica de JavaScript -->
    <script>
        // Función para abrir el zoom
        function abrirZoom(rutaImagen) {
            const overlay = document.getElementById('zoomOverlay');
            const imgGrande = document.getElementById('zoomImagen');
            
            // Asigna la fuente de la imagen clickeada a la imagen grande
            imgGrande.src = rutaImagen;
            // Muestra el overlay añadiendo la clase 'activo'
            overlay.classList.add('activo');
        }

        // Función para cerrar el zoom
        function cerrarZoom() {
            const overlay = document.getElementById('zoomOverlay');
            // Oculta el overlay quitando la clase 'activo'
            overlay.classList.remove('activo');
        }

        // Opcional: Cerrar también con la tecla Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                cerrarZoom();
            }
        });
    </script>

</body>
</html>
