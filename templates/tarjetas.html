<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Tarjetas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7AB4AD;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Grid responsiva para las tarjetas */
        .tarjetas-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilos individuales de la tarjeta */
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #333;
        }

        .card-description {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Botón de volver */
        .btn-volver {
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn-volver:hover {
            background-color: #0056b3;
        }
    </style>
    <link rel="shortcut icon" href="{{ url_for('static', filename='logo.ico') }}" type="image/x-icon">
</head>
<body>

    <div class="header">
        <h1>Paso a paso</h1>
        <!-- Botón para regresar a la página anterior/inicio -->
        <a href="{{ url_for('home') }}" class="btn-volver">← Volver</a>
    </div>

    <div class="tarjetas-container">
        {% for t in tarjetas %}
        <div class="card">
            <img src="{{ t.imagen }}" alt="{{ t.titulo }}" class="card-img">
            <div class="card-content">
                <h2 class="card-title">{{ t.titulo }}</h2>
                <p class="card-description">{{ t.descripcion }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
